[project]
name = "kyberos"
version = "0.2.0"
description = "Kyberos: A local-first, recursive AI agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "textual",
    "fastapi",
    "uvicorn",
    "apscheduler", 
    "litellm",
    "sqlmodel",
    "pydantic-settings",
    "mcp",
    "chromadb",
    "rich",
    "json5",
    "watchdog",
    "aiosqlite",
    "python-telegram-bot",
    "python-telegram-bot",
    "discord.py",
    "slack-sdk",
    "aiohttp",
    "psutil",
    "aiofiles",
    "sentence-transformers",
]

[project.scripts]
kyberos = "kyberos.cli:app"

[project.optional-dependencies]
bedrock = ["boto3>=1.28.57"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyberos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio",
]
